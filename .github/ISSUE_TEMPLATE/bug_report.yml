name: Bug report
description: Something behaves incorrectly.
title: '[Bug] '
labels: ['bug']

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this.

        **Please do not attach video or images containing anyone who has not
        agreed to appear.** If a visual is needed, record your own hand against
        a plain background.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
      placeholder: The palm flip fired the glitch twice for a single flip.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 138, Safari 18.4, Firefox 129
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: iPhone 14, iOS 18.4 · Windows 11 desktop · Pixel 7, Android 15
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the application
      options:
        - Camera or permissions
        - Gesture detection
        - Effects or filters, how it looks
        - Recording, preview or saving
        - Interface, layout or theme
        - Settings
        - Something else
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: Frame rate shown beside the gesture list
      placeholder: 58 fps
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any errors from the browser's developer console. This is automatically formatted as code.
      render: shell
    validations:
      required: false
