name: Device report
description: Tell us what happened on hardware we have not tested. Reports that something failed are the most useful.
title: '[Device] '
labels: ['device-report']

body:
  - type: markdown
    attributes:
      value: |
        Most of the support matrix in
        [docs/BROWSER-SUPPORT.md](https://github.com/Amey-Thakur/GESTURE-FX/blob/main/docs/BROWSER-SUPPORT.md)
        is expectation rather than observation, and iPhones are the largest gap.
        A report that recording failed is worth more to this project than most
        code.

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone 13 mini · Samsung Galaxy S23 · MacBook Air M2
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: iOS 18.4 · Android 15 · macOS 15.3
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari 18.4 · Chrome 138
    validations:
      required: true

  - type: dropdown
    id: preview
    attributes:
      label: Did the camera preview appear
      options: ['Yes', 'No', 'Yes, but distorted or misplaced']
    validations:
      required: true

  - type: dropdown
    id: gestures
    attributes:
      label: Were gestures recognised
      options:
        - 'Yes, reliably'
        - 'Yes, but it took several attempts'
        - 'No'
        - 'They fired when I had not made the gesture'
        - 'I did not try'
    validations:
      required: true

  - type: dropdown
    id: recording
    attributes:
      label: Did recording produce a playable file
      options:
        - 'Yes'
        - 'No, the file was empty or would not play'
        - 'No, recording never started'
        - 'The interface got stuck when I pressed stop'
        - 'The record control was disabled'
        - 'I did not try'
    validations:
      required: true

  - type: input
    id: fps
    attributes:
      label: Frame rate shown beside the gesture list
      placeholder: 42 fps
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Console errors, how it felt to use, what you would change.
    validations:
      required: false
