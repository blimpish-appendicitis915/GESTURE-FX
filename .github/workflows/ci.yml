# File: .github/workflows/ci.yml
# Author: Amey Thakur
# Repository: https://github.com/Amey-Thakur/GESTURE-FX
# License: MIT
#
# Verifies every pull request and every push that is not a deployment.
#
# There is no automated test suite yet, so this checks the two things that can
# be checked mechanically: that the project compiles under the strict compiler
# settings, and that it bundles. Detector tests over recorded landmark fixtures
# are the intended next addition, and this is where they will run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check and build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 18 is the minimum the project declares; 20 is what deployment uses.
        node-version: [18, 20]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Confirm the build produced both pages
        run: |
          test -f dist/index.html || { echo 'dist/index.html is missing'; exit 1; }
          test -f dist/404.html   || { echo 'dist/404.html is missing'; exit 1; }
          echo 'Build output verified.'
