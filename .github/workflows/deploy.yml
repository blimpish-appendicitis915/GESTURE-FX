# File: .github/workflows/deploy.yml
# Author: Amey Thakur
# Repository: https://github.com/Amey-Thakur/GESTURE-FX
# License: MIT
#
# Builds the application and publishes it to GitHub Pages.
#
# The build runs here rather than being committed, so `dist/` never appears in
# the repository and the published site is always the result of compiling the
# source at that commit. The type check runs before the bundle, so a change that
# does not compile cannot reach the site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs/screenshots/**'
      - 'LICENSE'
      - 'CITATION.cff'
      - 'codemeta.json'
  workflow_dispatch:

# Read the repository, write a Pages deployment, and prove the deployment came
# from this workflow. Nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is superseded rather than cancelled, so
# the last push always reaches production even if several land together.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Provisions Pages if it has never been enabled, so a fork deploys on
          # its first push rather than failing until someone visits Settings.
          enablement: true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
